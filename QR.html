<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Confirmed — Bella Vita Summit 2026</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    const originalWarn = console.warn;
    console.warn = function () {
      if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('cdn.tailwindcss.com should not be used in production')) return;
      originalWarn.apply(console, arguments);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2D2B3D',
            'primary-foreground': '#FFFFFF',
            secondary: '#FAF7F4',
            'secondary-foreground': '#2D2B3D',
            accent: '#FFBE98',
            'accent-foreground': '#2D2B3D',
            muted: '#F5EFEA',
            'muted-foreground': '#5F5A66',
            card: '#FFFFFF',
            'card-foreground': '#2D2B3D',
            border: 'rgba(229, 158, 122, 0.15)',
          }
        }
      }
    }
  </script>
</head>

<body>
  <div class="min-h-screen bg-background">
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent"  id="siteHeader">
      <nav class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between"><a href="#"
          class="flex items-center"><img src="./images/Bella_Vita_Summit_LOGO-07.0ce07b4a.png" alt="BellaVita 2026"
            class="h-[68px] md:h-[70px] w-auto object-contain transition-all duration-300"></a>
        <div class="hidden lg:flex items-center gap-12"><a href="./index.html"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Home<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#about"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">About<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#program"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Program<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#speakers"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Speakers<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#sponsors"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Sponsors<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#venue"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Venue<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a><a
            href="./index.html#contact"
            class="relative font-semibold text-sm tracking-wide transition-all duration-300 group text-[#2D2B3D]/90 hover:text-accent">Contact<span
              class="absolute -bottom-1.5 left-0 h-[2px] bg-gradient-to-r from-accent via-accent to-secondary transition-all duration-300 rounded-full w-0 group-hover:w-full"></span></a>
        </div><a href="./contact.html" class="hidden lg:block"><button
            class="bg-accent hover:bg-[#F8B995] text-accent-foreground px-9 py-3.5 rounded-lg font-semibold text-sm tracking-wide transition-all duration-300 shadow-[0_4px_20px_rgba(255,190,152,0.25)] hover:shadow-[0_8px_30px_rgba(255,190,152,0.4)] hover:translate-y-[-2px]">Register
            Now</button></a><button class="lg:hidden p-2 transition-colors duration-300 text-[#2D2B3D]"
          aria-label="Toggle menu"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg></button>
      </nav>
    </header>
    <div class="pt-32 pb-20 px-6">
      <div class="max-w-4xl mx-auto">
        <div
          class="bg-gradient-to-br from-primary to-primary/90 rounded-[32px] p-12 md:p-16 shadow-2xl border border-accent/20 text-center relative overflow-hidden">
          <div class="absolute top-10 right-10 opacity-10 w-40 h-40 pointer-events-none"><img
              src="./images/Bella_Vita_Summit_LOGO-08-1.d95daad7.png" alt=""
              class="w-full h-full object-contain animate-pulse" style="animation-duration: 6s;"></div>
          <div class="relative z-10">
            <div class="w-24 h-24 bg-accent rounded-full flex items-center justify-center mx-auto mb-8"><svg
                xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-circle-check w-14 h-14 text-primary">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
              </svg></div>
            <h1 class="text-5xl font-serif text-white mb-4">Registration Confirmed</h1>
            <p class="text-xl text-white/80 mb-12 font-light">Thank you for joining BellaVita 2026</p>
            <div class="bg-gradient-to-br from-white to-white/95 rounded-3xl p-10 mb-10 shadow-2xl">
              <div class="flex items-center justify-between mb-8"><img
                  src="./images/Bella_Vita_Summit_LOGO-07.0ce07b4a.png" alt="BellaVita" class="h-10 w-auto">
                <div class="px-4 py-1.5 bg-accent/10 text-accent text-xs font-bold tracking-wider rounded-full">VIP PASS
                </div>
              </div>
              <div class="grid md:grid-cols-2 gap-8 mb-8">
                <div class="space-y-4 text-left">
                  <div>
                    <div class="text-xs text-foreground/50 font-semibold uppercase tracking-wider mb-1">Attendee Name
                    </div>
                    <div id="qrName" class="text-2xl font-serif text-primary"></div>
                  </div>
                  <div>
                    <div class="text-xs text-foreground/50 font-semibold uppercase tracking-wider mb-1">Ticket ID</div>
                    <div id="qrTicket" class="text-lg font-mono font-semibold text-primary"></div>
                  </div>
                  <div>
                    <div class="text-xs text-foreground/50 font-semibold uppercase tracking-wider mb-1">Attendance Type
                    </div>
                    <div id="qrAttendance" class="text-lg font-semibold text-primary"></div>
                  </div>
                  <div>
                    <div class="text-xs text-foreground/50 font-semibold uppercase tracking-wider mb-1">Sessions</div>
                    <div id="qrSessions" class="text-lg font-semibold text-primary"></div>
                  </div>
                </div>
                <div class="flex items-center justify-center">
                  <div
                    class="w-48 h-48 bg-background rounded-2xl flex items-center justify-center border-2 border-accent/20">
                    <div class="text-7xl">QR</div>
                  </div>
                </div>
              </div>
              <div class="pt-6 border-t border-border space-y-2">
                <div class="flex items-center justify-center gap-2 text-sm text-foreground/60"><svg
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-calendar w-4 h-4">
                    <path d="M8 2v4"></path>
                    <path d="M16 2v4"></path>
                    <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                    <path d="M3 10h18"></path>
                  </svg><span>September 16–18, 2026</span></div>
                <div class="flex items-center justify-center gap-2 text-sm text-foreground/60"><svg
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-map-pin w-4 h-4">
                    <path
                      d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0">
                    </path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg><span>Landmark Amman Hotel and Conference Center</span></div>
              </div>
            </div>
            <div class="flex flex-wrap gap-4 justify-center"><button
                class="bg-accent hover:bg-accent/90 text-accent-foreground px-8 py-3.5 rounded-xl font-semibold transition-all duration-300 flex items-center gap-2 shadow-lg"><svg
                  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-download w-5 h-5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" x2="12" y1="15" y2="3"></line>
                </svg>Download Pass</button><button
                class="bg-white/10 hover:bg-white/20 text-white px-8 py-3.5 rounded-xl font-semibold transition-all duration-300 flex items-center gap-2 border border-white/20"><svg
                  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-mail w-5 h-5">
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>Email Pass</button><a href="./index.html"><button
                  class="bg-white/10 hover:bg-white/20 text-white px-8 py-3.5 rounded-xl font-semibold transition-all duration-300 flex items-center gap-2 border border-white/20"><svg
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-house w-5 h-5">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                    <path
                      d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
                    </path>
                  </svg>Back to Home</button></a></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const name = localStorage.getItem('bv_name') || 'Valued Guest';
        const attendance = localStorage.getItem('bv_attendance') || 'Full Summit';
        const ticket = localStorage.getItem('bv_ticket') || 'BV2026-TICKET';

        document.getElementById('qrName').innerText = name;
        document.getElementById('qrAttendance').innerText = attendance;
        document.getElementById('qrTicket').innerText = ticket;
        const sessions = localStorage.getItem('bv_sessions') || '0 selected';
        if (document.getElementById('qrSessions')) document.getElementById('qrSessions').innerText = sessions;
      });
    </script>
    <script src="./js/index.js" defer></script>
</body>

</html>
